<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>引き算練習</title>
    <link rel="stylesheet" href="style.css?v=7">
  </head>
  <body class="addition-page" data-operation="subtract">
    <nav class="page-nav"><a class="nav-button" href="addition.html">足し算</a><a class="nav-button" href="index.html">掛け算</a></nav>
    <p id="remaining" class="remaining" role="status">残り20個</p>
    <main class="addition-main">
      <h1>引き算練習</h1>
      <p id="daily-progress" role="status"></p>
      <p>20個の数字を計算する1セットを1問として数えます。</p>
      <p>重複なし：1〜20を各1回、210から引きます。</p>
      <p id="addition-guide">210から、表示される20個の数字を順番に引いてください。</p>
      <div id="addition-display" aria-live="polite" aria-atomic="true">
        <span id="number-label">準備完了</span>
        <strong id="current-number">210</strong>
      </div>
      <button id="button" type="button">開始する</button>
      <form id="total-form" hidden novalidate>
        <label for="total-input">最後の答え</label>
        <input id="total-input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="total-result">
        <button class="nav-button" type="submit">回答する</button>
      </form>
      <p id="total-result" role="status"></p>
      <p id="save-status" role="status"></p>
      <button id="calculation-toggle" class="nav-button" type="button" aria-expanded="false" aria-controls="calculation">途中の計算を表示</button>
      <section id="calculation" aria-label="表示済みの数字と合計" hidden>
        <p id="calculation-text">まだ数字を表示していません。</p>
      </section>
    </main>
    <script src="addition.js?v=3"></script>
  </body>
</html>
