<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History | Multiplication Practice</title>
    <link rel="stylesheet" href="style.css?v=7">
  </head>

  <body class="history-page">
    <nav class="page-nav"><a class="nav-button" href="index.html">&#21839;&#38988;&#12395;&#25147;&#12427;</a></nav>
    <p id="storage-status" role="status"></p>
    <section id="history" aria-labelledby="history-title">
      <h1 id="history-title">回答履歴</h1>
      <p>履歴はこのブラウザに保存されます（最新500件）。</p>
      <p id="summary"></p>
      <button id="history-reset" type="button">履歴をリセット</button>
      <p id="reset-status" role="status"></p>
      <div class="table-scroll" tabindex="0" role="region" aria-label="回答履歴の表">
        <table>
          <thead><tr><th scope="col">回答日時</th><th scope="col">問題</th><th scope="col">入力</th><th scope="col">正解</th><th scope="col">判定</th><th scope="col">回答時間</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
    <script src="script.js?v=5"></script>
  </body>
</html>
